[project]
name = "financial-ai-service"
version = "1.0.0"
description = "AI orchestration service for a personal finance application."
requires-python = ">=3.12"

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length is handled by formatting, not a hard error here.
# UP042: we deliberately use `class X(str, Enum)` rather than StrEnum for
# maximally predictable JSON/Pydantic serialization behavior across the
# codebase, not because we're unaware of StrEnum.
# B008: `Depends(...)` in a parameter default is FastAPI's standard,
# required dependency-injection pattern, not the "mutable default" footgun
# this rule targets elsewhere.
ignore = ["E501", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
# app/main.py deliberately runs a sys.path bootstrap before its `app.*` imports
# so the file stays runnable directly (VS Code Run button / `python app/main.py`).
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
